<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oficina &amp; Lab Dev | Contato</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="site-header__brand" href="index.html">
        <span>Oficina &amp; Lab Dev</span>
        <span class="site-header__badge">HTML5 + CSS3</span>
      </a>
      <nav aria-label="Navegação principal">
        <ul class="nav-menu">
          <li><a class="nav-menu__link" href="index.html">Início</a></li>
          <li><a class="nav-menu__link" href="catalogo.html">Catálogo</a></li>
          <li><a class="nav-menu__link" href="projetos.html">Projetos</a></li>
          <li><a class="nav-menu__link" href="guia.html">Guia</a></li>
          <li><a class="nav-menu__link nav-menu__link--active" href="contato.html">Contato</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <header class="section__header">
          <h1 class="section__title">Contato</h1>
          <p class="section__subtitle">Envie uma mensagem ou dúvida sobre o projeto.</p>
        </header>

        <form class="form-box" action="#" method="post">
          <div class="form-box__group">
            <label class="form-box__label" for="nome">Nome</label>
            <input class="form-box__input" id="nome" name="nome" type="text" required />
          </div>

          <div class="form-box__group">
            <label class="form-box__label" for="email">E-mail</label>
            <input class="form-box__input" id="email" name="email" type="email" required />
          </div>

          <div class="form-box__group">
            <label class="form-box__label" for="mensagem">Mensagem</label>
            <textarea class="form-box__textarea" id="mensagem" name="mensagem" rows="4" required></textarea>
          </div>

          <button class="btn btn--primary" type="submit">Enviar mensagem</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <p>Oficina &amp; Lab Dev — Contato.</p>
      <p><a class="nav-menu__link" href="index.html">Voltar ao início</a></p>
    </div>
  </footer>
</body>
</html>
